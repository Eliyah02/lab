<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Product Inventory Dashboard</title><link rel="stylesheet" href="css/style.css"></head><body><div class="container"><header><h1>Product Inventory Dashboard</h1></header><div class="controls"><div class="search-section"><input type="text" id="searchInput" placeholder="Enter product name"><select id="categoryFilter"><option value="All">All</option><option value="Accessories">Accessories</option><option value="Displays">Displays</option><option value="Storage">Storage</option><option value="Components">Components</option></select><button id="searchBtn">Search</button><button id="resetBtn">Reset</button></div></div><div class="summary"><div class="summary-card"><h3>Total Inventory Value</h3><p id="totalInventoryValue">₱0</p></div><div class="summary-card"><h3>Low-Stock Products</h3><p id="lowStockCount">0</p></div><div class="summary-card"><h3>Out-of-Stock Products</h3><p id="outOfStockCount">0</p></div></div><div id="noResultsMessage" style="display: none;"></div><div id="productList" class="product-grid"></div></div><script type="module" src="js/main.js"></script></body></html>
